name: Project Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Project System CLI
        run: |
          # Configure one trusted source for your team before enabling this workflow:
          # pip install project-system-cli==0.1.3
          # OR pip install git+https://github.com/YOUR_ORG/project-system.git@v0.1.3
          echo "Configure the Project System CLI install source in this workflow."
          exit 1
      - run: project validate
