[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-system-cli"
version = "0.11.0"
description = "Git-native AI-neutral project knowledge and governance CLI"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "httplib2>=0.22,<1",
]

[project.scripts]
project = "project_system.cli:main"

[tool.setuptools]
package-dir = {"" = "project_cli"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["project_cli"]

[tool.setuptools.package-data]
project_system_assets = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools.data-files]
"." = ["SYNC_PACK_V1.md", "SYNC_REQUEST_V1.md", "SYNC_PULL_V2.md", "SYNC_TERMINAL_V1.md", "SYNC_PICKUP_V1.md", "SYNC_WATCHER_V1.md", "SYNC_AUTO_WINDOWS_V1.md", "GOOGLE_WORKSPACE_BRIDGE_V1.md", "DESIGN_CHANGES_DESIGNER_V1.md"]
