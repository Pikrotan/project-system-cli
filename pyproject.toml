[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-system-cli"
version = "0.1.4"
description = "Git-native AI-neutral project knowledge and governance CLI"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
project = "project_system.cli:main"

[tool.setuptools]
package-dir = {"" = "project_cli"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["project_cli"]

[tool.setuptools.package-data]
project_system_assets = ["**/*"]
